<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Provas INSS - Gerador de Simulados</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #1e293b;
            --accent: #2563eb;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --correct-bg: #dcfce7;
            --correct-border: #16a34a;
            --correct-text: #14532d;
            --incorrect-bg: #fee2e2;
            --incorrect-border: #dc2626;
            --incorrect-text: #7f1d1d;
            --blank-bg: #fef9c3;
            --blank-border: #ca8a04;
            --blank-text: #713f12;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            padding: 24px 12px;
            line-height: 1.6;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 28px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .panel-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .panel-title {
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 16px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
            font-weight: 600;
        }

        .filter-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .control-group select {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
            background-color: white;
            outline: none;
        }

        .btn-action {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn-action:hover {
            background-color: #1d4ed8;
        }

        .btn-submit {
            background-color: #0d9488;
            font-size: 1.1rem;
            padding: 16px;
            margin-top: 24px;
        }

        .btn-submit:hover {
            background-color: #0f766e;
        }

        .question-card {
            position: relative;
        }

        .question-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 8px;
        }

        .badge-subject {
            background-color: #e2e8f0;
            color: var(--primary-dark);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .question-body {
            font-size: 1.05rem;
            margin-bottom: 16px;
            text-align: justify;
        }

        .question-body.struck-through {
            text-decoration: line-through;
            opacity: 0.4;
        }

        .options-container {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
        }

        .option-btn {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.15s;
        }

        .option-btn:hover {
            background-color: #f1f5f9;
        }

        .option-btn input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .tools-bar {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }

        .btn-strike-toggle {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .explanation-card {
            display: none;
            margin-top: 16px;
            padding: 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            border-left: 4px solid;
        }

        .explanation-card.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
        }

        .explanation-card.incorrect {
            background-color: var(--incorrect-bg);
            border-color: var(--incorrect-border);
            color: var(--incorrect-text);
        }

        .explanation-card.blank {
            background-color: var(--blank-bg);
            border-color: var(--blank-border);
            color: var(--blank-text);
        }

        #results-panel {
            display: none;
        }

        .score-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin: 20px 0;
            text-align: center;
        }

        .score-card {
            background-color: var(--bg-body);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .score-card .val {
            font-size: 2rem;
            font-weight: 700;
        }

        .score-card .lbl {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        @media (max-width: 640px) {
            .options-container {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <header>
        <h1>Simulador Misto INSS - Certo / Errado</h1>

            <div class="control-group">

            </div>
        </div>
        <button id="btn-generate" class="btn-action">Gerar Simulado Personalizado</button>
    </section>

    <section id="results-panel" class="panel-card">
        <h2 class="panel-title">Relatório de Desempenho</h2>
        <div class="score-grid">
            <div class="score-card">
                <div id="score-c" class="val" style="color: var(--correct-border);">0</div>
                <div class="lbl">Acertos (+1)</div>
            </div>
            <div class="score-card">
                <div id="score-e" class="val" style="color: var(--incorrect-border);">0</div>
                <div class="lbl">Erros (-1)</div>
            </div>
            <div class="score-card">
                <div id="score-b" class="val" style="color: var(--blank-border);">0</div>
                <div class="lbl">Em Branco (0)</div>
            </div>
            <div class="score-card">
                <div id="score-net" class="val" style="color: var(--primary);">0</div>
                <div class="lbl">Nota Líquida</div>
            </div>
        </div>
        <button id="btn-reset" class="btn-action" style="background-color: var(--text-muted);">Configurar Novo Simulado</button>
    </section>

    <form id="quiz-form">
        <div id="questions-wrapper"></div>
        <button id="btn-submit-quiz" type="submit" class="btn-action btn-submit" style="display: none;">Finalizar e Ver Resultado</button>
    </form>
</div>

let activeQuestions = [];

/**
 * Algoritmo de Embaralhamento Sem Viés (Fisher-Yates)
 */
function shuffleArray(arr) {
    const clone = [...arr];
    for (let i = clone.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [clone[i], clone[j]] = [clone[j], clone[i]];
    }
    return clone;
}

/**
 * Geração de Simulado Personalizado
 */
function generateSimulado() {
    const selectedSubject = document.getElementById('subject-select').value;
    const selectedQty = document.getElementById('quantity-select').value;

    let filtered = questionsDatabase.filter(q => {
        return selectedSubject === 'ALL' || q.materia === selectedSubject;
    });

    if (filtered.length === 0) {
        alert("Não foram encontradas questões para a matéria selecionada.");
        return;
    }

    filtered = shuffleArray(filtered);

    if (selectedQty !== 'MAX') {
        const limit = parseInt(selectedQty, 10);
        filtered = filtered.slice(0, limit);
    }

    activeQuestions = filtered;
    renderQuiz();
}

/**
 * Renderização da Interface
 */
function renderQuiz() {
    const wrapper = document.getElementById('questions-wrapper');
    wrapper.innerHTML = '';

    activeQuestions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'panel-card question-card';
        card.id = `card-q-${q.id}`;

        card.innerHTML = `
            <div class="question-meta">
                <span>Item ${idx + 1} de ${activeQuestions.length}</span>
                <span class="badge-subject">${q.materia} (${q.concurso})</span>
            </div>
            <div class="question-body" id="text-q-${q.id}">${q.enunciado}</div>
            <div class="options-container">
                <label class="option-btn">
                    <input type="radio" name="opt-${q.id}" value="C"> CERTO
                </label>
                <label class="option-btn">
                    <input type="radio" name="opt-${q.id}" value="E"> ERRADO
                </label>
            </div>
            <div class="tools-bar">
                <button type="button" class="btn-strike-toggle" onclick="toggleStrikethrough('${q.id}')">Riscar Texto</button>
            </div>
            <div class="explanation-card" id="exp-${q.id}"></div>
        `;

        wrapper.appendChild(card);
    });

    document.getElementById('btn-submit-quiz').style.display = 'block';
    document.getElementById('results-panel').style.display = 'none';
    window.scrollTo({ top: document.getElementById('quiz-form').offsetTop - 20, behavior: 'smooth' });
}

/**
 * Funcionalidade de Riscar/Desriscar Enunciado
 */
function toggleStrikethrough(id) {
    const elem = document.getElementById(`text-q-${id}`);
    elem.classList.toggle('struck-through');
}

 * Apuração do Resultado (Envio Único ao Final)
 */

        const expBox = document.getElementById(`exp-${q.id}`);

        // Bloquear opções
        const radios = document.g
